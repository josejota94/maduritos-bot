services:
  - type: web
    name: maduritos-bot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && npm install && chmod +x start.sh"
    startCommand: "bash start.sh"
    envVars:
      - key: LAT_LOCAL
        value: "-6.0350"
      - key: LON_LOCAL
        value: "-76.9700"
      - key: RADIO_MAXIMO_KM
        value: "4.0"
      - key: PEDIDO_MINIMO_UNIDADES
        value: "3"
      - key: VERIFY_TOKEN
        value: "TOKEN_SECRETO_WEBHOOK"
      - key: WHATSAPP_TOKEN
        value: ""
      - key: PHONE_NUMBER_ID
        value: ""
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIM_EMAIL
        value: "mailto:tu_correo@ejemplo.com"
      - key: DATABASE_URL
        sync: false
