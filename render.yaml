services:
  - type: web
    name: maduritos-bot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && curl -fsSL https://nodejs.org/dist/v20.18.1/node-v20.18.1-linux-x64.tar.xz -o /tmp/node.tar.xz && mkdir -p node20 && tar -xf /tmp/node.tar.xz -C node20 --strip-components=1 && ./node20/bin/npm install && chmod +x start.sh"
    startCommand: "bash start.sh"
    envVars:
      - key: LAT_LOCAL
        value: "-6.0350"
      - key: LON_LOCAL
        value: "-76.9700"
      - key: RADIO_MAXIMO_KM
        value: "4.0"
      - key: PEDIDO_MINIMO_UNIDADES
        value: "3"
      - key: DIRECCION_LOCAL
        value: "Jr. Lima cuadra 4, frente al Banco BCP"
      - key: BAILEYS_PUERTO
        value: "8088"
      - key: VERIFY_TOKEN
        value: "TOKEN_SECRETO_WEBHOOK"
      - key: WHATSAPP_TOKEN
        value: ""
      - key: PHONE_NUMBER_ID
        value: ""
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIM_EMAIL
        value: "mailto:tu_correo@ejemplo.com"
      - key: DATABASE_URL
        fromDatabase:
          name: maduritos-db
          property: connectionString

# Base de datos Postgres administrada por Render. Reemplaza al archivo
# SQLite local, que se borraba cada vez que el servicio se reiniciaba.
#
# OJO: en el plan "free", Render borra la base a los 90 días de haberla
# creado (no por inactividad, simplemente cumplidos los 90 días) — hay que
# crear una nueva a tiempo o pasar a un plan pago antes de esa fecha para no
# perder tu historial de pedidos.
databases:
  - name: maduritos-db
    plan: free
